name: Core and Compose tests

# Native artifacts are generated in CI from the checked-in Rust sources. Firebase
# and wallet secrets remain optional for compilation and are never committed.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Rust core tests
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Update Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Run core tests
        run: cargo test --workspace
        working-directory: core

  compose:
    name: Compose JVM + Android checks
    runs-on: macos-latest
    env:
      # One ABI is enough for PR compilation; release jobs still build all phone
      # ABIs through the default in core/build-android.sh.
      SONAR_ABIS: -t arm64-v8a
      SONAR_FEATURES: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Update Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2

      - name: Compile Compose and run JVM tests
        run: ./gradlew :composeApp:compileKotlinJvm :composeApp:jvmTest :composeApp:compileDebugKotlinAndroid
        working-directory: apps/sonar
